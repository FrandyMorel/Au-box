name: Au-box CI

on:
  push:
    branches:
      - dev
      - qa
      - main

  pull_request:
    branches:
      - dev
      - qa
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Backend/au-box

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Backend/au-box/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint

      - name: Build application
        run: npm run build

      - name: Run tests
        run: npm test -- --runInBand
